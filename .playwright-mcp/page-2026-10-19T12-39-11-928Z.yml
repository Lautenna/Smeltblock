          - heading "Aide" [level=2] [ref=f1e150]
          - paragraph [ref=f1e151]: Besoin d'aide ? Notre équipe de Guides, Modérateurs, Administrateurs et Fondateurs est présente pour répondre aux questions en jeu et sur discord.
          - list [ref=f1e152]:
            - listitem [ref=f1e153]:
              - text: ▪ Tu as la possibilité d'utiliser la commande
              - mark [ref=f1e154]: /helpop <message>
              - text: pour envoyer un message à l'ensemble des membres du staff connectés.
            - paragraph [ref=f1e155]: Toute demande concernant les quêtes doivent être effectuée via cette commande ou en ticket afin de ne pas spoil les joueurs.
            - listitem [ref=f1e156]: ▪ Tu peux directement poser ta question dans le chat afin que des joueurs ou des membres du staff puissent y répondre.
            - listitem [ref=f1e157]: ▪ Tu peux mentionner le pseudonyme d'un membre du staff connecté, il recevra automatiquement une notification.
          - heading "Ouvrir un ticket" [level=2] [ref=f1e158]
          - paragraph [ref=f1e159]:
            - text: Tout d'abord, tu dois t'assurer d'avoir un compte Discord et d'avoir rejoint notre
            - link [ref=f1e160] [cursor=pointer]:
              - /url: https://smeltblock.com/discord
              - strong [ref=f1e161]: discord
            - strong [ref=f1e162]: .
          - paragraph [ref=f1e163]: Ensuite, dans la catégorie "Support", clique sur "#créer_un_ticket".
          - figure
          - paragraph [ref=f1e164]: Puis, clique sur le menu déroulant pour choisir la raison de ton ticket.
          - figure
          - figure
          - paragraph [ref=f1e165]: Une fois fait, cela créera un salon nommé "[XXX]-PSEUDO" dans la catégorie "Support".
          - paragraph [ref=f1e166]: C'est ici que tu devras détailler ton problème. Les formules de politesses sont les bienvenues (Bonjour, merci...).
          - figure
          - paragraph [ref=f1e168]: Une réponse sera généralement donnée dans un délai ne dépassant pas 24 heures.
